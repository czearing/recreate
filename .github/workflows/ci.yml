name: CI

on:
  workflow_dispatch:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@master
      - uses: actions/setup-node@v6
        with:
          node-version: 22
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all -- --check
      - run: cargo clippy --all-targets --locked -- -D warnings
      - run: cargo test --all-targets --locked
        env:
          RECREATE_BROWSER: /usr/bin/google-chrome
      - name: Release gate
        run: cargo test --locked --bin recreate -- --ignored --exact release_gate_tests::generic_browser_release_gate
        env:
          RECREATE_BROWSER: /usr/bin/google-chrome
      - run: cargo build --release --locked
      - uses: actions/upload-artifact@v4
        with:
          name: release-gate-evidence
          path: target/release-gate/evidence.json
          if-no-files-found: error

  backtest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@master
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: backtest
      - run: cargo fmt --manifest-path backtest/Cargo.toml --all -- --check
      - run: cargo clippy --manifest-path backtest/Cargo.toml --all-targets --locked -- -D warnings
      - run: cargo test --manifest-path backtest/Cargo.toml --all-targets --locked
      - run: cargo build --manifest-path backtest/Cargo.toml --release --locked
      - name: Qualify diff sensitivity and stability
        run: |
          backtest/target/release/recreate-backtest qualify \
            --fixtures backtest/fixtures \
            --output backtest/target/qualification.json \
            --repeat 3
        env:
          RECREATE_BACKTEST_BROWSER: /usr/bin/google-chrome
      - uses: actions/upload-artifact@v4
        with:
          name: backtest-qualification
          path: backtest/target/qualification.json
          if-no-files-found: error
