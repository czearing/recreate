<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Layout isolation control</title>
  <style>
    body { margin: 0; font-family: Arial, sans-serif; }
    button { position: fixed; width: 120px; height: 40px; }
    .alpha { left: 100px; top: 260px; }
    .bravo { left: 600px; top: 300px; }
    .gamma { left: 1100px; top: 700px; }
  </style>
</head>
<body>
  <button class="gamma" aria-label="Gamma">Gamma</button>
  <button class="alpha" aria-label="Alpha">Alpha</button>
  <button class="bravo" aria-label="Bravo">Bravo</button>
</body>
</html>
